name: Build Universal Custom Recovery (TWRP / OrangeFox / PBRP / SHRP / Lineage)

on:
  workflow_dispatch:
    inputs:
      RECOVERY_ENGINE:
        description: 'Select Custom Recovery Framework'
        required: true
        default: 'OrangeFox'
        type: choice
        options:
          - OrangeFox
          - TWRP
          - PitchBlack
          - SkyHawk
          - LineageOS
          - AOSP
      MANIFEST_BRANCH:
        description: 'Branch (Leave empty for auto-detect: Fox=fox_12.1, TWRP=twrp-12.1, PBRP=android-12.1, SHRP=twrp-12.1, Lineage=lineage-21.0, AOSP=twrp-12.1)'
        required: false
        default: ''
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    name: Build Recovery Image
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: device/infinix/X6871

      - name: Free Disk Space (Reclaim 40+ GB)
        run: |
          echo "=== Disk Space Before Cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf /usr/share/codeql
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force 2>/dev/null || true
          sudo apt-get clean
          # Safely manage swap space to boost RAM without collision
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile /mnt/swapfile 2>/dev/null || true
          sudo fallocate -l 8G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=8192
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          sudo sysctl vm.swappiness=10
          echo "=== Disk & Swap Space After Cleanup ==="
          df -h
          free -h

      - name: Setup Build Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf lib32ncurses5-dev lib32z1-dev liblz4-tool libncurses5 \
            libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop \
            pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python3-pip openjdk-11-jdk
          # Install Google repo tool (not available via apt)
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Setup Persistent Ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ inputs.RECOVERY_ENGINE }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ inputs.RECOVERY_ENGINE }}-
            ccache-

      - name: Sync Recovery Manifest
        run: |
          # Fix GitLab 401/403 auth error by clearing all GitHub extraheader tokens
          git config --global --unset-all http.extraheader 2>/dev/null || true
          git config --system --unset-all http.extraheader 2>/dev/null || true
          git config --global --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git config --system --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          export GIT_TERMINAL_PROMPT=0

          mkdir -p ~/work && cd ~/work
          ENGINE="${{ inputs.RECOVERY_ENGINE }}"
          BRANCH="${{ inputs.MANIFEST_BRANCH }}"

          # Dynamic Branch Fallback if MANIFEST_BRANCH is left empty in UI modal
          if [ -z "$BRANCH" ]; then
            case "$ENGINE" in
              "OrangeFox"|"TWRP"|"AOSP"|"SkyHawk") BRANCH="twrp-12.1" ;;
              "PitchBlack") BRANCH="android-12.1" ;;
              "LineageOS") BRANCH="lineage-21.0" ;;
              *) BRANCH="twrp-12.1" ;;
            esac
          fi

          echo "Selected Recovery Engine: $ENGINE"
          echo "Using Manifest Branch: $BRANCH"

          if [ "$ENGINE" = "OrangeFox" ]; then
            repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b $BRANCH --depth=1 || \
            repo init -u https://gitlab.com/OrangeFox/Manifest.git -b fox_12.1 --depth=1
          elif [ "$ENGINE" = "TWRP" ]; then
            repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b $BRANCH --depth=1
          elif [ "$ENGINE" = "PitchBlack" ]; then
            repo init -u https://github.com/PitchBlackRecoveryProject/manifest_pb.git -b $BRANCH --depth=1
          elif [ "$ENGINE" = "SkyHawk" ]; then
            repo init -u https://github.com/SHRP/platform_manifest_twrp_omni.git -b $BRANCH --depth=1
          elif [ "$ENGINE" = "LineageOS" ]; then
            repo init -u https://github.com/LineageOS/android.git -b $BRANCH --depth=1
          elif [ "$ENGINE" = "AOSP" ]; then
            repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b $BRANCH --depth=1
          fi

          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Clone Missing Dependencies (gflags)
        run: |
          cd ~/work
          if [ ! -d "external/gflags" ]; then
            git clone https://android.googlesource.com/platform/external/gflags/ -b android-12.1.0_r4 external/gflags
          fi

      - name: Copy Device Tree & Fetch Prebuilt Assets
        run: |
          mkdir -p ~/work/device/infinix/X6871
          cp -r $GITHUB_WORKSPACE/device/infinix/X6871/* ~/work/device/infinix/X6871/
          mkdir -p ~/work/device/infinix/X6871/prebuilt
          cd ~/work/device/infinix/X6871/prebuilt
          if [ ! -f "dtbo.img" ]; then
            curl -sSL "https://github.com/sheikhmehraann/android_device_transsion_x6871-pbrp-twrp/releases/download/V1/dtbo.img" -o dtbo.img || true
          fi
          if [ ! -f "dtb" ]; then
            curl -sSL "https://github.com/sheikhmehraann/android_device_transsion_x6871-pbrp-twrp/releases/download/V1/dtb" -o dtb || true
          fi
          if [ ! -f "kernel" ]; then
            curl -sSL "https://github.com/sheikhmehraann/android_device_transsion_x6871-pbrp-twrp/releases/download/V1/kernel" -o kernel || true
          fi
          echo "=== Prebuilt Directory Contents ==="
          ls -lh ~/work/device/infinix/X6871/prebuilt/

      - name: Compile Recovery Image
        run: |
          cd ~/work

          # CRITICAL: Force clean out/ directory to prevent stale ninja cache
          echo "=== Cleaning out/ directory for fresh build ==="
          rm -rf out/

          export USE_CCACHE=1
          export CCACHE_DIR=~/.ccache
          export ALLOW_MISSING_DEPENDENCIES=true
          export SOONG_ALLOW_MISSING_DEPENDENCIES=true
          ccache -M 3G
          ccache -z

          source build/envsetup.sh
          ENGINE="${{ inputs.RECOVERY_ENGINE }}"

          case "$ENGINE" in
            "OrangeFox") LUNCH_TARGET="fox_X6871-userdebug" ;;
            "TWRP") LUNCH_TARGET="twrp_X6871-userdebug" ;;
            "PitchBlack") LUNCH_TARGET="pbrp_X6871-userdebug" ;;
            "SkyHawk") LUNCH_TARGET="shrp_X6871-userdebug" ;;
            "LineageOS") LUNCH_TARGET="lineage_X6871-userdebug" ;;
            "AOSP") LUNCH_TARGET="aosp_X6871-userdebug" ;;
            *) LUNCH_TARGET="twrp_X6871-userdebug" ;;
          esac

          echo "=== Launching build for target: $LUNCH_TARGET ==="
          lunch $LUNCH_TARGET

          # Step 1: Build vendor_boot image (contains recovery for GKI v4 devices)
          echo "=== Step 1: Building vendorbootimage ==="
          mka vendorbootimage -j$(nproc --all) 2>&1 || true

          # Step 2: Build recovery image (may be stub on GKI v4, but needed for packaging)
          echo "=== Step 2: Building recoveryimage ==="
          mka recoveryimage -j$(nproc --all) 2>&1 || true

          # Step 3: Build boot image
          echo "=== Step 3: Building bootimage ==="
          mka bootimage -j$(nproc --all) 2>&1 || true

          # Step 4: Build engine-specific packaging (PBRP zip, OrangeFox zip, etc.)
          echo "=== Step 4: Building engine-specific packaging ==="
          case "$ENGINE" in
            "PitchBlack") mka pbrp -j$(nproc --all) 2>&1 || true ;;
            "SkyHawk") mka shrp -j$(nproc --all) 2>&1 || true ;;
            *) echo "No engine-specific packaging target for $ENGINE" ;;
          esac

          echo "=== Ccache Statistics ==="
          ccache -s

          # Debug: Show ALL generated images in out/target/product/
          echo "=== DEBUG: All .img files in out/target/product/ ==="
          find out/target/product/ -name "*.img" -exec ls -lh {} \; 2>/dev/null || echo "No .img files found"
          echo "=== DEBUG: All .zip files in out/target/product/ ==="
          find out/target/product/ -name "*.zip" -exec ls -lh {} \; 2>/dev/null || echo "No .zip files found"
          echo "=== DEBUG: Full listing of out/target/product/X6871/ ==="
          ls -lhR out/target/product/X6871/ 2>/dev/null | head -100 || echo "Product directory not found"

      - name: Prepare Build Artifacts
        run: |
          mkdir -p ~/artifacts
          echo "=== Searching for Build Outputs ==="

          # Search broadly for recovery artifacts in the build output tree
          find ~/work/out/ -type f \( \
            -name "vendor_boot.img" -o \
            -name "boot.img" -o \
            -name "recovery.img" -o \
            -name "*.zip" \
          \) -not -path "*/.git/*" 2>/dev/null | while read f; do
            SIZE=$(stat -c%s "$f" 2>/dev/null || echo 0)
            echo "Found: $f ($(numfmt --to=iec $SIZE))"
            # Only copy files larger than 1MB (skip tiny stubs)
            if [ "$SIZE" -gt 1048576 ]; then
              cp "$f" ~/artifacts/
              echo "  -> Copied to artifacts (real image)"
            else
              echo "  -> SKIPPED (too small, likely a stub)"
            fi
          done

          # Also search the broader workspace for any generated images
          find /home/runner/work/ -maxdepth 8 -type f -name "vendor_boot.img" -not -path "*/device/*" -not -path "*/.git/*" 2>/dev/null | while read f; do
            SIZE=$(stat -c%s "$f" 2>/dev/null || echo 0)
            if [ "$SIZE" -gt 1048576 ]; then
              echo "Found vendor_boot.img: $f ($(numfmt --to=iec $SIZE))"
              cp "$f" ~/artifacts/
            fi
          done

          # If no real images found, fall back to copying everything (for debugging)
          if [ -z "$(ls -A ~/artifacts/ 2>/dev/null)" ]; then
            echo "WARNING: No large images found! Copying all outputs for debugging..."
            find ~/work/out/target/product/X6871/ -maxdepth 1 -type f \( -name "*.img" -o -name "*.zip" \) -exec cp {} ~/artifacts/ \; 2>/dev/null || true
          fi

          echo "=== Prepared Artifacts ==="
          ls -lh ~/artifacts/

          if [ -z "$(ls -A ~/artifacts/ 2>/dev/null)" ]; then
            echo "ERROR: No build artifacts found at all!"
            echo "=== Full out/target/product/ listing for debugging ==="
            find ~/work/out/target/product/ -type f -name "*.img" -exec ls -lh {} \; 2>/dev/null || echo "No product output found"
            exit 1
          fi

          # Validate vendor_boot.img exists and is reasonable size
          if [ -f ~/artifacts/vendor_boot.img ]; then
            VB_SIZE=$(stat -c%s ~/artifacts/vendor_boot.img)
            echo "vendor_boot.img size: $VB_SIZE bytes ($(numfmt --to=iec $VB_SIZE))"
            if [ "$VB_SIZE" -lt 10000000 ]; then
              echo "WARNING: vendor_boot.img is suspiciously small ($VB_SIZE bytes)"
            else
              echo "vendor_boot.img looks good! Ready for fastboot flash vendor_boot"
            fi
          else
            echo "WARNING: vendor_boot.img not found in artifacts!"
            echo "This device uses vendor_boot as recovery partition."
            echo "Check build log debug output above for clues."
          fi

      - name: Upload Recovery Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Recovery-${{ inputs.RECOVERY_ENGINE }}-X6871-${{ github.run_id }}
          path: ~/artifacts/*
          if-no-files-found: error
          compression-level: 6
